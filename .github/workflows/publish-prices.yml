name: publish-prices

on:
  schedule:
    - cron: '*/30 * * * *'   # هر ۳۰ دقیقه؛ GitHub ممکن است چند دقیقه تأخیر داشته باشد
  workflow_dispatch:          # اجرای دستی همیشه پست می‌گذارد

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Post prices (scheduled)
        if: github.event_name == 'schedule'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          ADMIN_ID: ${{ vars.ADMIN_ID }}
        run: npx tgcloud run endpoints/publishPrices '{"scheduled":true}' --ctx "{\"initData\":{\"user\":{\"id\":$ADMIN_ID}}}"
      - name: Post prices (manual)
        if: github.event_name != 'schedule'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          ADMIN_ID: ${{ vars.ADMIN_ID }}
        run: npx tgcloud run endpoints/publishPrices '{}' --ctx "{\"initData\":{\"user\":{\"id\":$ADMIN_ID}}}"
